[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remind-prompt"
version = "0.1.0"
description = "Local-first prompt reminders with a web dashboard and Slack delivery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116",
  "httpx>=0.28",
  "uvicorn>=0.35",
]

[project.scripts]
remind-prompt = "remind_prompt.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/remind_prompt"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
