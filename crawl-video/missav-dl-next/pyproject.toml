[project]
name = "hls-download-manager"
version = "1.0.0"
description = "Persistent, memory-bounded HLS download manager"
requires-python = ">=3.13,<3.14"
dependencies = [
    "curl-cffi>=0.16,<0.17",
    "playwright>=1.59,<2",
    "python-dotenv>=1.1,<2",
    "starlette>=0.47,<1",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Direct fd writes are intentional; these metadata calls remain tiny and bounded.
"src/hls_manager/downloader.py" = ["ASYNC240"]
# Async tests inspect temp files and poll the synchronous SQLite source of truth.
"tests/*.py" = ["ASYNC110", "ASYNC240"]
